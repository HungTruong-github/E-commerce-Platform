services:
  gateway:
    image: nginx:alpine
    container_name: ecommerce_prod_gateway
    restart: always
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ecommerce_network

  web:
    build:
      context: ../../../
      dockerfile: infrastructure/docker/production/Dockerfile.web
    container_name: ecommerce_prod_web
    restart: always
    environment:
      - NODE_ENV=production
    expose:
      - '8080'
    networks:
      - ecommerce_network

  api:
    build:
      context: ../../../
      dockerfile: infrastructure/docker/production/Dockerfile.api
    container_name: ecommerce_prod_api
    restart: always
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - API_HOST=0.0.0.0
      - API_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce_network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Notice: Database port is not exposed to host in production
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  redis:
    image: redis:7-alpine
    container_name: ecommerce_prod_redis
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    # Notice: Redis port is not exposed to host in production
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  ecommerce_network:
    driver: bridge
